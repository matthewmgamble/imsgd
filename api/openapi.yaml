openapi: 3.0.3
info:
  title: imsgd API
  version: 1.0.0
  description: |
    imsgd exposes iMessage on a Mac to applications on the local network: read chats and messages,
    receive new messages in real time, and send messages.

    **Conventions**
    - JSON field names are `snake_case`; timestamps are RFC 3339 in UTC; absent values are `null`.
    - IDs (`chat_id`, `message_id`, `attachment_id`) are Apple GUIDs. Treat them as opaque strings:
      on macOS 26 a direct chat looks like `any;-;+15551234567`, on older systems `iMessage;-;…`.
      **Percent-encode IDs** in URLs. In query strings this is required: a raw `;` makes the whole
      query string invalid (400). `+` must be sent as `%2B`, or it is read as a space.
    - List endpoints return `{"data": [...], "next_cursor": "..."}`. Pass `next_cursor` back as `cursor`
      to get the next page; it is `null` on the last page. Cursors are opaque.
    - Errors return `{"error": {"code": "...", "message": "..."}}` with a matching HTTP status.

    **Authentication**: send `Authorization: Bearer <api key>` on every `/api/v1` request.

    See `docs/api.md` for a guide with examples.
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8642
    description: Default local address

security:
  - bearerAuth: []

tags:
  - name: system
  - name: chats
  - name: messages
  - name: handles
  - name: attachments
  - name: events
  - name: webhooks

paths:
  /health:
    get:
      tags: [system]
      summary: Liveness and readiness
      description: Does not require authentication. Returns 503 if the Messages database is unreadable.
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }
        "503":
          description: Degraded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Health" }

  /api/v1/server:
    get:
      tags: [system]
      summary: Server information
      operationId: getServer
      responses:
        "200":
          description: Server information
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ServerInfo" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/openapi.yaml:
    get:
      tags: [system]
      summary: This OpenAPI document
      operationId: getOpenAPI
      responses:
        "200":
          description: The specification
          content:
            application/yaml:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/chats:
    get:
      tags: [chats]
      summary: List chats
      description: Chats ordered by most recent activity, newest first.
      operationId: listChats
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Case-insensitive search over display name, chat identifier and participant addresses.
          schema: { type: string, maxLength: 200 }
        - $ref: "#/components/parameters/ChatInclude"
      responses:
        "200":
          description: A page of chats
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/chats/{chat_id}:
    get:
      tags: [chats]
      summary: Get a chat
      description: Participants are always included.
      operationId: getChat
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/ChatInclude"
      responses:
        "200":
          description: The chat
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Chat" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/chats/{chat_id}/messages:
    get:
      tags: [chats, messages]
      summary: List a chat's messages
      description: |
        Messages in one chat ordered by time. The default `order=desc` returns newest first, which suits
        scrolling back through history; `order=asc` starts at the oldest message.
      operationId: listChatMessages
      parameters:
        - $ref: "#/components/parameters/ChatID"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: order
          in: query
          schema: { type: string, enum: [desc, asc], default: desc }
      responses:
        "200":
          description: A page of messages
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/messages:
    get:
      tags: [messages]
      summary: Sync messages
      description: |
        Returns messages with `rowid` greater than `since_id`, oldest first. This is the incremental
        sync primitive: store the `next_since_id` from each response and pass it back next time.
        Row IDs only increase, so no message is skipped. Messages without a chat (rare) are included
        with `chat_id: null`. Note that this returns *new* messages only; changes to existing messages
        (delivery, read, edits) arrive as real-time events.
      operationId: syncMessages
      parameters:
        - name: since_id
          in: query
          description: Return messages with `rowid` greater than this. Use 0 for a full sync.
          schema: { type: integer, format: int64, minimum: 0, default: 0 }
        - name: chat_id
          in: query
          description: Only messages in this chat.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Messages after `since_id`
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MessageSync" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

    post:
      tags: [messages]
      summary: Send a message
      description: |
        Sends text and/or attachments to an existing chat (`chat_id`) or to a phone number or email (`to`),
        through Messages on the Mac. Each part (the text, then each attachment) is sent as its own message.

        **How confirmation works.** Messages accepts a send before knowing whether it will be delivered.
        imsgd watches the Messages database for the row each part creates and reports its fate through
        the `send` object:
        - `pending`: waiting for the message to appear or to be sent
        - `sent`
        - `delivered`
        - `failed`: see `send.error`

        **Waiting.** By default (`wait: true`) the request waits up to 60 s for every part to appear in the
        database, then returns `201` with the resulting `messages`. If that takes longer, or with
        `wait: false`, it returns `202` immediately. Follow progress with `GET /api/v1/sends/{send_id}` or
        `send.updated` events.

        **Idempotency.** Give each logical send a unique `client_ref`. Repeating a request with the same
        `client_ref` (per API key) returns the original send instead of sending again, with the
        `Idempotent-Replay: true` header.

        **Attachments.** Send `multipart/form-data` with a `payload` field holding the JSON fields and one or
        more `attachments` file fields (at most 10). Files are stored permanently under
        `~/Library/Messages/Attachments/imsgd/`, because Messages references them from your history.

        imsgd never retries a failed send automatically, because a retry could deliver a duplicate.

        **Rate limit.** 60 sends per minute per API key, with bursts of up to 20. Beyond that it returns
        `429` with `Retry-After`. Configure the limit with `send_rate_per_minute`.
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendRequest" }
          multipart/form-data:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: "`SendRequest` as a JSON string."
                attachments:
                  type: array
                  items: { type: string, format: binary }
      responses:
        "200":
          description: Idempotent replay of an earlier send (`Idempotent-Replay` header set)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendResponse" }
        "201":
          description: Every part appeared in Messages (inspect `send.status`, which may be `failed`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendResponse" }
        "202":
          description: Accepted; confirmation still pending
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "413":
          description: Request body too large (`upload_max_mb`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/sends/{send_id}:
    get:
      tags: [messages]
      summary: Get a send's status
      description: Sends are visible only to the API key that created them.
      operationId: getSend
      parameters:
        - name: send_id
          in: path
          required: true
          schema: { type: string, example: snd_4c1d9e7f2a6b8031 }
      responses:
        "200":
          description: The send and the messages it produced so far
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SendResponse" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/messages/{message_id}:
    get:
      tags: [messages]
      summary: Get a message
      operationId: getMessage
      parameters:
        - name: message_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Message" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/handles:
    get:
      tags: [handles]
      summary: List handles
      description: Addresses (phone numbers and emails) known to Messages, in creation order.
      operationId: listHandles
      parameters:
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
        - name: q
          in: query
          description: Substring match on the address.
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: A page of handles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HandleList" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/attachments/{attachment_id}:
    get:
      tags: [attachments]
      summary: Get attachment metadata
      operationId: getAttachment
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
      responses:
        "200":
          description: The attachment
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Attachment" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/attachments/{attachment_id}/content:
    get:
      tags: [attachments]
      summary: Download attachment content
      description: |
        Streams the file, or a converted copy. Supports `Range` requests. Returns 404 with code
        `attachment_unavailable` when the file is not on this Mac (not yet downloaded, or offloaded to
        iCloud).

        `format`:
        - `original` (default): the file as stored.
        - `jpeg`: for images. Converts HEIC, PNG, GIF (first frame), WebP, AVIF and so on to JPEG, which any
          client can display. Combine with `max_size` for thumbnails.
        - `m4a`: for audio. Converts Messages voice notes (CAF) to AAC in an M4A container.
        - `live`: for Live Photos (`live_photo: true`). Returns the companion QuickTime video.

        Converted files are cached on the Mac. The first request for a large HEIC may take a second.
      operationId: getAttachmentContent
      parameters:
        - $ref: "#/components/parameters/AttachmentID"
        - name: format
          in: query
          schema: { type: string, enum: [original, jpeg, m4a, live], default: original }
        - name: max_size
          in: query
          description: "With `format=jpeg`: scale down so the longest edge is at most this many pixels. Never upscales."
          schema: { type: integer, minimum: 16, maximum: 8192 }
      responses:
        "200":
          description: File content, with the attachment's MIME type as `Content-Type`.
          content:
            "*/*":
              schema: { type: string, format: binary }
        "206":
          description: Partial content (Range request)
          content:
            "*/*":
              schema: { type: string, format: binary }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: "The conversion failed (code `conversion_failed`)."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /api/v1/events:
    get:
      tags: [events]
      summary: Real-time events (WebSocket)
      description: |
        Upgrades to a WebSocket that streams events as JSON text frames. The API key can be sent as
        `Authorization: Bearer <key>` or, for browsers that cannot set WebSocket headers, as `?token=`.

        The first frame is always a `Hello` frame. Every frame after it is an `Event`. The server sends
        WebSocket pings every 30 s.

        **Resuming.** Store the `id` of the last event you processed and reconnect with
        `?last_event_id=<id>`. Missed events still in the server's buffer (the last 10,000) are replayed
        before live events. If `hello.data.resumed` is `false`, events were lost (the server restarted or
        the gap was too long). In that case, catch up on new messages with
        `GET /api/v1/messages?since_id=` and re-fetch any messages whose state you care about.

        **Close codes.** `1001` means the server is shutting down. `1013` means the client read too slowly;
        reconnect with `last_event_id`.
      operationId: streamEvents
      parameters:
        - name: last_event_id
          in: query
          description: Resume after this event ID.
          schema: { type: string }
        - name: types
          in: query
          description: "Comma-separated event types to receive. `message.*` matches every message event. Default: all."
          schema: { type: string, example: "message.received,chat.read" }
        - name: chat_id
          in: query
          description: Only events for these chats. Repeat the parameter for several chats.
          schema:
            type: array
            items: { type: string }
          style: form
          explode: true
        - name: token
          in: query
          description: API key, for clients that cannot send an `Authorization` header.
          schema: { type: string }
      responses:
        "101":
          description: Switching protocols; frames are `Hello`, then `Event` objects.
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/webhooks:
    get:
      tags: [webhooks]
      summary: List webhooks
      operationId: listWebhooks
      responses:
        "200":
          description: All webhooks
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [webhooks]
      summary: Create a webhook
      description: |
        Registers an endpoint that receives a signed `POST` for every matching event. The response includes
        the signing `secret`. **It is only shown once.**
      operationId: createWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookCreate" }
      responses:
        "201":
          description: Created. Includes `secret`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/v1/webhooks/{webhook_id}:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      tags: [webhooks]
      summary: Get a webhook
      operationId: getWebhook
      responses:
        "200":
          description: The webhook
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [webhooks]
      summary: Update a webhook
      description: Only the fields you send are changed.
      operationId: updateWebhook
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WebhookUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Webhook" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [webhooks]
      summary: Delete a webhook
      description: Pending deliveries for the webhook are discarded.
      operationId: deleteWebhook
      responses:
        "204": { description: Deleted }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/webhooks/{webhook_id}/test:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    post:
      tags: [webhooks]
      summary: Send a test event
      description: Immediately POSTs a signed `webhook.test` event (not queued or retried) and reports the outcome.
      operationId: testWebhook
      responses:
        "200":
          description: Result of the test delivery (inspect `ok`)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WebhookTestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/v1/webhooks/{webhook_id}/deliveries:
    parameters:
      - $ref: "#/components/parameters/WebhookID"
    get:
      tags: [webhooks]
      summary: Recent deliveries
      description: The most recent delivery attempts, newest first. Finished deliveries are kept for 7 days.
      operationId: listWebhookDeliveries
      parameters:
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Deliveries
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: "#/components/schemas/WebhookDelivery" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: An API key from the `api_keys` list in the imsgd config file.

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size.
      schema: { type: integer, minimum: 1, maximum: 1000, default: 100 }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `next_cursor`.
      schema: { type: string }
    ChatID:
      name: chat_id
      in: path
      required: true
      schema: { type: string }
      example: "any;-;+15551234567"
    WebhookID:
      name: webhook_id
      in: path
      required: true
      schema: { type: string, example: wh_3f9a1c2b7d4e5f60 }
    AttachmentID:
      name: attachment_id
      in: path
      required: true
      schema: { type: string }
    ChatInclude:
      name: include
      in: query
      description: |
        Comma-separated extras. `participants` (lists only; always included for a single chat),
        `last_message`.
      schema: { type: string, example: "participants,last_message" }

  responses:
    TooManyRequests:
      description: "Rate limit exceeded (`rate_limited`). `Retry-After` gives the seconds to wait, when known."
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    BadRequest:
      description: Invalid parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable, machine-readable error code.
              enum: [bad_request, unauthorized, not_found, attachment_unavailable, method_not_allowed, payload_too_large, conversion_failed, rate_limited, internal]
            message:
              type: string
              description: Human-readable explanation.

    Health:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          additionalProperties: { type: string }
          example: { messages_db: ok }

    ServerInfo:
      type: object
      required: [version, macos_version, started_at, messages_db]
      properties:
        version: { type: string, example: "0.1.0" }
        macos_version: { type: string, example: "26.5.2" }
        started_at: { type: string, format: date-time }
        messages_db:
          type: object
          required: [max_rowid]
          properties:
            max_rowid:
              type: integer
              format: int64
              description: Highest message `rowid`; a full sync is complete once `next_since_id` reaches it.

    Handle:
      type: object
      description: A phone number or email address.
      required: [address, service, name]
      properties:
        address: { type: string, example: "+15551234567" }
        service: { type: string, example: iMessage, description: "iMessage, SMS or RCS." }
        name:
          type: string
          nullable: true
          description: |
            Contact name from the Mac's Contacts ("First Last", else nickname, else company), when contact
            resolution is enabled and a match exists.

    Chat:
      type: object
      required: [id, display_name, is_group, identifier, service, is_archived, last_message_at, last_read_at]
      properties:
        id: { type: string, example: "any;+;chat123456789" }
        display_name:
          type: string
          nullable: true
          description: Group name, if one was set. Direct chats have none.
        is_group: { type: boolean }
        identifier: { type: string, description: "chat_identifier: the address for direct chats, or a group ID." }
        service: { type: string, example: iMessage }
        is_archived: { type: boolean }
        last_message_at: { type: string, format: date-time, nullable: true }
        last_read_at:
          type: string
          format: date-time
          nullable: true
          description: When you last read this chat on any of your devices.
        participants:
          type: array
          description: Other participants, in the order Messages shows them. Present when requested.
          items: { $ref: "#/components/schemas/Handle" }
        last_message:
          allOf: [{ $ref: "#/components/schemas/Message" }]
          nullable: true
          description: Present when `include=last_message`.

    ChatList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Chat" }
        next_cursor: { type: string, nullable: true }

    Message:
      type: object
      required:
        - id
        - rowid
        - chat_id
        - type
        - from_me
        - sender
        - text
        - subject
        - service
        - parts
        - mentions
        - links
        - attachments
        - created_at
        - delivered_at
        - read_at
        - edited_at
        - is_sent
        - is_delivered
        - is_read
        - error
        - unsent
        - unsent_parts
        - edits
        - reaction
        - group_event
        - location_share
        - reply_to_id
        - effect
        - app
      properties:
        id: { type: string, description: "Message GUID." }
        rowid:
          type: integer
          format: int64
          description: Monotonically increasing row ID; use with `GET /api/v1/messages?since_id=`.
        chat_id: { type: string, nullable: true, description: "null for the rare message not attached to a chat." }
        type:
          type: string
          enum: [message, reaction, group_event, location_share]
          description: |
            `message` is an ordinary message (text and/or attachments). `reaction` is a tapback (see
            `reaction`). `group_event` records a group change (see `group_event`). `location_share` is a
            location-sharing notice.
        from_me: { type: boolean, description: "Sent by the account owner, from any of their devices." }
        sender:
          allOf: [{ $ref: "#/components/schemas/Handle" }]
          nullable: true
          description: The sender of incoming messages; `null` when `from_me` is true.
        text:
          type: string
          description: Plain text with attachment placeholders removed. Empty for attachment-only messages.
        subject: { type: string, nullable: true }
        service: { type: string, description: "iMessage, SMS or RCS." }
        parts:
          type: array
          description: |
            Message parts in display order. A message can interleave text and attachments; each part is
            either text or a reference to one of `attachments`.
          items: { $ref: "#/components/schemas/MessagePart" }
        mentions:
          type: array
          items: { $ref: "#/components/schemas/Mention" }
        links:
          type: array
          items: { $ref: "#/components/schemas/Link" }
        attachments:
          type: array
          description: Visible attachments. Internal ones (such as link-preview data) are omitted.
          items: { $ref: "#/components/schemas/Attachment" }
        created_at: { type: string, format: date-time }
        delivered_at: { type: string, format: date-time, nullable: true }
        read_at:
          type: string
          format: date-time
          nullable: true
          description: For your messages, when the recipient read it (if they share read receipts).
        edited_at: { type: string, format: date-time, nullable: true }
        is_sent: { type: boolean }
        is_delivered: { type: boolean }
        is_read: { type: boolean }
        error:
          type: integer
          description: Non-zero if Messages failed to send this message (e.g. 22 = recipient unreachable, 25 = attachment rejected).
        unsent: { type: boolean, description: "The sender unsent the whole message; `text` is empty." }
        unsent_parts:
          type: array
          description: Indexes of individually unsent parts.
          items: { type: integer }
        edits:
          type: array
          description: Previous versions of edited parts, oldest first.
          items: { $ref: "#/components/schemas/Edit" }
        reaction:
          allOf: [{ $ref: "#/components/schemas/Reaction" }]
          nullable: true
        group_event:
          allOf: [{ $ref: "#/components/schemas/GroupEvent" }]
          nullable: true
        location_share:
          allOf: [{ $ref: "#/components/schemas/LocationShare" }]
          nullable: true
        reply_to_id:
          type: string
          nullable: true
          description: For inline replies, the ID of the message that started the thread.
        effect:
          type: string
          nullable: true
          description: Expressive send style, e.g. `com.apple.MobileSMS.expressivesend.impact`.
        app:
          type: string
          nullable: true
          description: Bundle ID of the iMessage app that produced the message (link previews, Apple Pay, games…).

    MessagePart:
      type: object
      required: [index, text, attachment_id]
      properties:
        index: { type: integer }
        text: { type: string }
        attachment_id: { type: string, nullable: true }

    Mention:
      type: object
      required: [start, length, address]
      description: An @mention. `start`/`length` are UTF-16 code unit offsets into `text`'s source.
      properties:
        start: { type: integer }
        length: { type: integer }
        address: { type: string }

    Link:
      type: object
      required: [start, length, url]
      description: A URL in the text. `start`/`length` are UTF-16 code unit offsets.
      properties:
        start: { type: integer }
        length: { type: integer }
        url: { type: string }

    Edit:
      type: object
      required: [part, edited_at, text]
      properties:
        part: { type: integer }
        edited_at: { type: string, format: date-time, description: "When this version was replaced." }
        text: { type: string, description: "The text before the edit." }

    Reaction:
      type: object
      required: [kind, emoji, removed, target_id, target_part]
      properties:
        kind:
          type: string
          enum: [love, like, dislike, laugh, emphasize, question, emoji, sticker]
        emoji: { type: string, nullable: true, description: "For `kind: emoji`." }
        removed: { type: boolean, description: "The sender removed this reaction." }
        target_id: { type: string, description: "The message reacted to." }
        target_part: { type: integer, description: "Part of the target message reacted to." }

    GroupEvent:
      type: object
      required: [kind, participant, title]
      properties:
        kind:
          type: string
          enum: [participant_added, participant_removed, participant_left, renamed, icon_changed, icon_removed]
        participant:
          allOf: [{ $ref: "#/components/schemas/Handle" }]
          nullable: true
          description: The participant added, removed or leaving.
        title: { type: string, nullable: true, description: "New name, for `renamed`." }

    LocationShare:
      type: object
      required: [status, direction]
      description: Raw `share_status`/`share_direction` values from Messages; their meaning is not documented by Apple.
      properties:
        status: { type: integer }
        direction: { type: integer }

    Attachment:
      type: object
      required: [id, message_id, filename, mime_type, uti, size, width, height, is_sticker, is_outgoing, available, live_photo, created_at]
      properties:
        id: { type: string }
        message_id: { type: string, nullable: true }
        filename: { type: string, description: "Original file name." }
        mime_type: { type: string, example: image/heic }
        uti: { type: string, nullable: true, example: public.heic }
        size:
          type: integer
          format: int64
          description: Size in bytes (the file's actual size when `available`, otherwise as recorded by Messages).
        width:
          type: integer
          nullable: true
          description: |
            Display width in pixels for images on this Mac, with EXIF/HEIF rotation applied (so it matches what a
            viewer shows). `null` for non-images and unavailable files.
        height: { type: integer, nullable: true, description: "Display height in pixels; see `width`." }
        is_sticker: { type: boolean }
        is_outgoing: { type: boolean }
        available:
          type: boolean
          description: The file is on this Mac and can be downloaded from `/content`.
        live_photo:
          type: boolean
          description: "A Live Photo; the video is available from `/content?format=live`."
        created_at: { type: string, format: date-time, nullable: true }

    MessageList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_cursor: { type: string, nullable: true }

    MessageSync:
      type: object
      required: [data, next_since_id, has_more]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Message" }
        next_since_id:
          type: integer
          format: int64
          description: Pass as `since_id` on the next call. Equals the request's `since_id` when `data` is empty.
        has_more: { type: boolean, description: "More messages are immediately available." }

    HandleList:
      type: object
      required: [data, next_cursor]
      properties:
        data:
          type: array
          items: { $ref: "#/components/schemas/Handle" }
        next_cursor: { type: string, nullable: true }

    Hello:
      type: object
      description: First WebSocket frame.
      required: [type, data]
      properties:
        type: { type: string, enum: [hello] }
        data:
          type: object
          required: [server_version, resumed, last_event_id, replayed]
          properties:
            server_version: { type: string }
            resumed:
              type: boolean
              description: "false if `last_event_id` was given but missed events are no longer available."
            last_event_id: { type: string, nullable: true, description: "The newest event ID on the server." }
            replayed: { type: integer, description: "Number of buffered events replayed before live events." }

    Event:
      type: object
      description: |
        The envelope for every event, both on the WebSocket and in webhook request bodies. The shape of `data`
        depends on `type`:

        | type | data |
        |---|---|
        | `message.received` | `MessageEventData`: a new message from someone else |
        | `message.sent` | `MessageEventData`: a new message from you (from any of your devices) |
        | `message.updated` | `MessageUpdatedEventData`: a message changed |
        | `chat.read` | `ChatReadEventData`: you read a chat on one of your devices |
        | `send.updated` | `SendUpdatedEventData`: a send made through this API changed status |
      required: [id, type, created_at, data]
      properties:
        id:
          type: string
          description: Unique, increasing within a server process. Pass as `last_event_id` to resume.
          example: 9f2c41aa-1532
        type:
          type: string
          enum: [message.received, message.sent, message.updated, chat.read, send.updated]
        created_at: { type: string, format: date-time }
        data:
          oneOf:
            - $ref: "#/components/schemas/MessageEventData"
            - $ref: "#/components/schemas/MessageUpdatedEventData"
            - $ref: "#/components/schemas/ChatReadEventData"
            - $ref: "#/components/schemas/SendUpdatedEventData"

    MessageEventData:
      type: object
      required: [message]
      properties:
        message: { $ref: "#/components/schemas/Message" }

    MessageUpdatedEventData:
      type: object
      required: [message, changes]
      properties:
        message: { $ref: "#/components/schemas/Message" }
        changes:
          type: array
          description: What changed. The full current message is in `message`.
          items:
            type: string
            enum: [sent, delivered, read, played, edited, unsent, failed]

    ChatReadEventData:
      type: object
      required: [chat_id, read_at]
      properties:
        chat_id: { type: string }
        read_at: { type: string, format: date-time }

    Webhook:
      type: object
      required: [id, url, events, chat_ids, description, enabled, created_at, updated_at]
      properties:
        id: { type: string, example: wh_3f9a1c2b7d4e5f60 }
        url: { type: string, format: uri }
        events:
          type: array
          description: Event type filters (`message.*` allowed). Empty means all events.
          items: { type: string }
        chat_ids:
          type: array
          description: Only events for these chats. Empty means all chats.
          items: { type: string }
        description: { type: string }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        secret:
          type: string
          description: "Signing secret. Only returned by `POST /api/v1/webhooks`."
          example: whsec_bS1kZ0x0eDl3...

    WebhookCreate:
      type: object
      required: [url]
      additionalProperties: false
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        chat_ids:
          type: array
          items: { type: string }
        description: { type: string }
        enabled: { type: boolean, default: true }

    WebhookUpdate:
      type: object
      additionalProperties: false
      properties:
        url: { type: string, format: uri }
        events:
          type: array
          items: { type: string }
        chat_ids:
          type: array
          items: { type: string }
        description: { type: string }
        enabled: { type: boolean }

    WebhookTestResult:
      type: object
      required: [ok, status_code, error, duration_ms]
      properties:
        ok: { type: boolean }
        status_code: { type: integer, nullable: true }
        error: { type: string, nullable: true }
        duration_ms: { type: integer }

    WebhookDelivery:
      type: object
      required: [id, event_id, event_type, status, attempts, next_attempt_at, last_status_code, last_error, created_at, updated_at]
      properties:
        id: { type: string }
        event_id: { type: string }
        event_type: { type: string }
        status:
          type: string
          enum: [pending, succeeded, failed]
          description: "`pending` deliveries are retried after 10 s, 30 s, 2 min, 10 min and 30 min, then marked `failed`."
        attempts: { type: integer }
        next_attempt_at: { type: string, format: date-time, nullable: true }
        last_status_code: { type: integer, nullable: true }
        last_error: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SendUpdatedEventData:
      type: object
      required: [send]
      properties:
        send: { $ref: "#/components/schemas/Send" }

    SendRequest:
      type: object
      additionalProperties: false
      properties:
        chat_id:
          type: string
          description: Existing chat to send to. Exactly one of `chat_id` and `to` is required.
        to:
          type: string
          description: Phone number (any common format) or email address. Messages creates the direct chat if needed.
          example: "+15551234567"
        service:
          type: string
          enum: [iMessage, SMS]
          default: iMessage
          description: "Only with `to`. SMS requires Text Message Forwarding from an iPhone."
        text:
          type: string
          maxLength: 20000
          description: Required unless attachments are uploaded.
        client_ref:
          type: string
          maxLength: 200
          description: Idempotency key, unique per API key.
        wait:
          type: boolean
          default: true
          description: Wait up to 60 s for the messages to appear before responding.

    SendResponse:
      type: object
      required: [send, messages]
      properties:
        send: { $ref: "#/components/schemas/Send" }
        messages:
          type: array
          description: Messages created so far, one per matched part.
          items: { $ref: "#/components/schemas/Message" }

    Send:
      type: object
      required: [id, client_ref, status, chat_id, to, service, error, items, created_at, updated_at]
      properties:
        id: { type: string, example: snd_4c1d9e7f2a6b8031 }
        client_ref: { type: string, nullable: true }
        status:
          type: string
          enum: [pending, sent, delivered, failed]
          description: |
            `failed` if any part failed. `delivered` once all parts are delivered. `sent` once all parts are at
            least sent. Otherwise `pending`.
        chat_id:
          type: string
          nullable: true
          description: The target chat, or for `to` sends, the chat the message landed in once known.
        to: { type: string, nullable: true }
        service: { type: string, nullable: true }
        error: { type: string, nullable: true, description: "Why the send failed (first failing part)." }
        items:
          type: array
          items: { $ref: "#/components/schemas/SendItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SendItem:
      type: object
      required: [index, kind, text, filename, status, message_id, error]
      properties:
        index: { type: integer }
        kind: { type: string, enum: [text, attachment] }
        text: { type: string, nullable: true }
        filename: { type: string, nullable: true }
        status: { type: string, enum: [pending, sent, delivered, failed] }
        message_id: { type: string, nullable: true, description: "The message this part created, once matched." }
        error: { type: string, nullable: true }
